name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Un push sobre una rama que ya tenia una ejecucion en curso cancela la anterior:
# el resultado que importa es el del ultimo commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Compilacion y tests unitarios
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache de NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # La clave sale de los archivos que fijan las versiones: con gestion central
          # de paquetes, Directory.Packages.props es el unico lugar donde cambian.
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      # TreatWarningsAsErrors solo aca: en local un warning no tiene que frenar el
      # trabajo, pero no tiene por que llegar a main.
      - run: dotnet build --no-restore -c Release -warnaserror

      - name: Tests unitarios
        run: >
          dotnet test tests/MusicReviews.UnitTests
          --no-build -c Release
          --logger "trx;LogFileName=unit.trx"
          --results-directory artifacts/test-results

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: artifacts/test-results
          if-no-files-found: ignore

  integration:
    name: Tests de integracion
    runs-on: ubuntu-latest
    # Job separado a proposito: los de integracion levantan PostgreSQL con
    # Testcontainers y tardan bastante mas. Asi un error de compilacion o un test
    # unitario roto se ve en un minuto en vez de en cinco.
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      # El runner de GitHub ya trae Docker, que es lo unico que Testcontainers necesita.
      - name: Tests de integracion
        run: >
          dotnet test tests/MusicReviews.IntegrationTests
          --no-build -c Release
          --logger "trx;LogFileName=integration.trx"
          --results-directory artifacts/test-results

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: artifacts/test-results
          if-no-files-found: ignore

  docker:
    name: Imagen de contenedor
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # No se publica en ningun registro: se compila para que un Dockerfile roto se
      # descubra en el pull request y no en el despliegue.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
